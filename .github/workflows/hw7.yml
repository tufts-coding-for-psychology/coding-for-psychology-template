name: HW7 autograder

# Triggers on hw7/ itself plus the repo-root data/ folder, since hw7.qmd
# writes its simulated-data CSV there.
on:
  push:
    paths:
      - "hw7/**"
      - "data/**"

jobs:
  check:
    # Skip on the template repo itself -- there's never a real submission
    # here to check, only in each student's own copy created via "Use this
    # template." Without this, every push to the template (even a README
    # edit) trips a false-failure email.
    # ...and skip the repo-creation push itself: templating a new student repo
    # generates an initial commit touching every hwN/ folder at once, which
    # would fire all six checks (and six failure emails) before any work exists.
    if: github.repository != 'tufts-coding-for-psychology/coding-for-psychology-template' && github.event.created != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw7
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      # check_hw7.R now purls and runs hw7.qmd's actual R code (same pattern
      # as HW3), so it needs tidyverse + knitr, unlike the old presence-only
      # version of this check.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::tidyverse
            any::knitr
          cache-version: 1

      - name: Run HW7 checkpoint checks
        run: Rscript check_hw7.R
