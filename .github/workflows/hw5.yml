name: HW5 autograder

# Triggers on hw5/ itself plus the repo-root folders HW5 actually asks
# students to set up (task/, data/, analysis/) — unlike every other
# homework, HW5's real deliverables live outside its own folder.
on:
  push:
    paths:
      - "hw5/**"
      - "task/**"
      - "data/**"
      - "analysis/**"

jobs:
  check:
    # Skip on the template repo itself -- there's never a real submission
    # here to check, only in each student's own copy created via "Use this
    # template." Without this, every push to the template (even a README
    # edit) trips a false-failure email.
    # ...and skip the repo-creation push itself: templating a new student repo
    # generates an initial commit touching every hwN/ folder at once, which
    # would fire all six checks (and six failure emails) before any work exists.
    if: github.repository != 'tufts-coding-for-psychology/coding-for-psychology-template' && github.event.created != true
    runs-on: ubuntu-latest
    # Deliberately no working-directory override: check_hw5.R checks
    # repo-root folders (task/, data/, analysis/), so it needs to run from
    # the repo root, not from inside hw5/.
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      # No dependency install step needed: check_hw5.R is a presence-only
      # check (dir.exists()/list.files()) using only base R.
      - name: Run HW5 structural checks
        run: Rscript hw5/check_hw5.R
