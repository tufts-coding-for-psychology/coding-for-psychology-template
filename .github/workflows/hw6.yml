name: HW6 autograder

# Everything HW6 touches lives inside hw6/ (the qmd, and the simulated CSV
# it writes to hw6/data/), so the path filter stays folder-scoped.
on:
  push:
    paths:
      - "hw6/**"

jobs:
  check:
    # Skip on the template repo itself -- there's never a real submission
    # here to check, only in each student's own copy created via "Use this
    # template." Without this, every push to the template (even a README
    # edit) trips a false-failure email.
    # ...and skip the repo-creation push itself: templating a new student repo
    # generates an initial commit touching every hwN/ folder at once, which
    # would fire all six checks (and six failure emails) before any work exists.
    if: github.repository != 'tufts-coding-for-psychology/coding-for-psychology-template' && github.event.created != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw6
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      # check_hw6.R purls and runs hw6.qmd's actual R code (same pattern as
      # HW3/HW7), so it needs tidyverse + knitr with dependency caching.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::tidyverse
            any::knitr
          cache-version: 1

      - name: Run HW6 checkpoint checks
        run: Rscript check_hw6.R
